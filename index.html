<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="description" content="A cinematic camera sequence controlled frame-by-frame by scrolling.">
<title>Camera — Scroll Sequence</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="camera-sequence" id="camera-sequence">
  <canvas id="sequence"></canvas>

  <div class="topbar">
    <span>CAMERA / 01</span>
    <span class="counter" id="counter">001 / 169</span>
  </div>

  <div class="intro">
    <p>SCROLL-DRIVEN OBJECT STUDY</p>
    <h1>Every scroll.<br><i>One frame.</i></h1>
    <span>Scroll to explore ↓</span>
  </div>

  <div class="loading" id="loading">LOADING SEQUENCE <b>0%</b></div>
  <div class="bar"><span id="progress"></span></div>
</section>

<section class="next-section">
  <p class="eyebrow">THE SEQUENCE</p>
  <h2>A camera that moves<br>with your scroll.</h2>
  <p>169 frames. One continuous interaction. Scroll back up and the sequence reverses just as precisely.</p>
  <a href="#camera-sequence">Replay ↑</a>
</section>
<script src="script.js"></script>
</body>
</html>
