name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract camera frames
        run: |
          unzip -o "Final-attempt-camera-frames.zip" "frames/*" -d .
          test -f frames/frame-001.jpg
          test -f frames/frame-169.jpg
          echo "Camera frames ready: $(find frames -name 'frame-*.jpg' | wc -l)"
          rm -f "Final-attempt-camera-frames.zip"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
